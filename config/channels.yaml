# How each source is read and how GA4 traffic maps to a paid channel.
channels:
  google_ads:
    label: Google Ads
    api_version: v21
    page_size: 50          # rows per page in the simulated API; the real API pages at 10,000
  meta:
    label: Meta
    api_version: v24.0
    # Meta reports one purchase under several action types (purchase, omni_purchase,
    # offsite_conversion.fb_pixel_purchase). Summing them counts each purchase up to three times.
    conversion_action: omni_purchase
  microsoft_ads:
    label: Microsoft Ads
    poll_interval_s: 0.0   # simulated; real reports poll every few seconds
    max_polls: 20
  tiktok:
    label: TikTok
    page_size: 100
ga4:
  key_event_metric: keyEvents   # GA4 renamed "conversions" to "keyEvents" in 2024
  revenue_metric: totalRevenue
  page_size: 250
  # session source / medium -> paid channel. Anything else (organic, direct, email) is not paid media.
  paid_source_medium:
    google / cpc: google_ads
    facebook / paid: meta
    fb / paid: meta
    instagram / paid: meta
    bing / cpc: microsoft_ads
    tiktok / paid: tiktok
http:
  timeout_s: 30
  max_retries: 4
  backoff_base_s: 0.0      # tests and the simulator; production sets 1.0
