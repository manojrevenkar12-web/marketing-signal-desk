# Local stack: Postgres, the web app and the task worker. `docker compose up`, then
# `docker compose run --rm web python manage.py migrate && ... seed_demo`.
services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: msd, POSTGRES_PASSWORD: msd, POSTGRES_DB: msd}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U msd"], interval: 5s, retries: 10}
  web:
    build: .
    environment: &env
      DATABASE_URL: postgresql://msd:msd@db:5432/msd
      MSD_ENV: prod
      MSD_SSL_REDIRECT: "0"
      MSD_SECRET_KEY: local-compose-only-change-me-0123456789abcdefghijklmnopqrstuvwxyz
      MSD_ALLOWED_HOSTS: localhost,127.0.0.1
      MSD_TASK_BACKEND: django_tasks_db.DatabaseBackend
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  worker:
    build: .
    command: ["python", "manage.py", "db_worker"]
    environment: *env
    depends_on: {db: {condition: service_healthy}}
